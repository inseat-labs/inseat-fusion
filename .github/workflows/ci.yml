name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli/main.js plan examples/tasks/*.json
      - run: node dist/cli/main.js validate-events fixtures/progress/valid/*.json
      - run: node dist/cli/main.js simulate examples/tasks/high-risk-critique.json --scenario timed-out --at 1 > /dev/null
